<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAZZO | Call Center V7 PREMIUM UI</title>

<link href="https://fonts.cdnfonts.com/css/bring-race" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#180000,#8b0000,#1a0000);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
    padding:20px;
    color:#fff;
    font-family:Arial,sans-serif;
}

@keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.container{max-width:520px;margin:auto}

.logo{text-align:center;font-size:42px;margin-bottom:25px}
.logo span{font-family:'Bring Race'}
.white{color:#fff}
.red{color:#ff0000;text-shadow:0 0 10px #ff0000}

.card{
    background:rgba(255,255,255,.08);
    border-radius:18px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 0 20px rgba(255,0,0,.15);
    backdrop-filter:blur(12px);
}

/* 🔥 GRID ORGANIZADO */
.grid-2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

/* 🔥 INPUT PREMIUM */
input,select{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(0,0,0,.35);
    color:#fff;
    font-size:14px;
    outline:none;
    transition:0.2s;
}

input::placeholder{
    color:#ccc;
}

input:focus,select:focus{
    border:1px solid #ff0000;
    box-shadow:0 0 8px rgba(255,0,0,.6);
    background:rgba(0,0,0,.5);
}

/* 🔥 BOTÃO PREMIUM */
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:linear-gradient(90deg,#ff0000,#8b0000);
    color:#fff;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
    transition:0.2s;
    box-shadow:0 0 12px rgba(255,0,0,.4);
}

button:hover{
    transform:scale(1.03);
    box-shadow:0 0 18px rgba(255,0,0,.7);
}

button:active{
    transform:scale(0.97);
}

/* 🔥 CARDS INTERNOS */
.item{
    background:rgba(0,0,0,.45);
    padding:12px;
    margin-bottom:10px;
    border-radius:12px;
}

/* ERRO */
.input-erro{
    border:2px solid red !important;
}

.erro-msg{
    color:#ff4d4d;
    font-size:13px;
    display:none;
    margin-top:-5px;
    margin-bottom:5px;
}

#painelGerente{display:none}
</style>
</head>

<body>

<div class="container">

<div class="logo">
<span class="white">TA</span><span class="red">ZZ</span><span class="white">O</span>
</div>

<!-- REGISTRO -->
<div class="card">
<h3>Registrar Ligação</h3>

<select id="vendedor">
<option>Joabe</option>
<option>João Vitor</option>
<option>Fábio</option>
<option>Caio Henrique</option>
</select>

<input id="cliente" placeholder="Cliente">

<div class="grid-2">
<input id="telefone" placeholder="Telefone">
<input id="cpfcnpj" placeholder="CPF/CNPJ">
</div>

<div id="erroDuplicado" class="erro-msg">⚠️ Ligação duplicada hoje</div>

<div class="grid-2">
<select id="atendida">
<option value="SIM">Atendida</option>
<option value="NAO">Não atendida</option>
</select>

<select id="converteu">
<option value="NAO">Não virou venda</option>
<option value="SIM">Virou venda</option>
</select>
</div>

<input id="obs" placeholder="Observação">

<button onclick="registrar()">Registrar ligação</button>
</div>

<!-- RESUMO -->
<div class="card">
<h3>Resumo do Dia</h3>
<div id="resumo"></div>
</div>

<!-- FILTRO -->
<div class="card">
<h3>Filtro</h3>
<select id="filtroVendedor" onchange="render()">
<option value="TODOS">Todos</option>
<option>Joabe</option>
<option>João Vitor</option>
<option>Fábio</option>
<option>Caio Henrique</option>
</select>
</div>

<button onclick="login()">Painel Gerente</button>

<div id="painelGerente" class="card">
<h3>Painel Gerente</h3>
<button onclick="logout()">Sair</button>
</div>

<!-- LISTA -->
<div class="card">
<h3>Ligações</h3>
<div id="lista"></div>
</div>

</div>

<script>
// 🔥 NÃO ALTEREI SUA LÓGICA
const API="https://script.google.com/macros/s/AKfycbxpj0nN8Hv6F7fAr8CgC9Vp9IQgEYkT6otLUCwJMK-JRty1u0H1EjjBlKBJ3tpw4hxs/exec";
const SENHA="gerentazzo";

let registros=[];

function hoje(){return new Date().toLocaleDateString("pt-BR");}
function dataBR(d){return new Date(d).toLocaleDateString("pt-BR");}

function limparErro(){
    telefone.classList.remove("input-erro");
    erroDuplicado.style.display="none";
}
telefone.addEventListener("input", limparErro);

function login(){
    if(prompt("Senha:")===SENHA){
        localStorage.setItem("gerente","1");
        painelGerente.style.display="block";
    }
}
function logout(){
    localStorage.removeItem("gerente");
    painelGerente.style.display="none";
}
function verificar(){
    if(localStorage.getItem("gerente")==="1"){
        painelGerente.style.display="block";
    }
}

async function registrar(){
    const tel=telefone.value.trim();
    if(!tel) return;

    const duplicado=registros.some(r=>r.telefone===tel && dataBR(r.data)===hoje());

    if(duplicado){
        telefone.classList.add("input-erro");
        erroDuplicado.style.display="block";
        return;
    }

    await fetch(API,{
        method:"POST",
        body:JSON.stringify({
            action:"registrar",
            vendedor:vendedor.value,
            cliente:cliente.value,
            telefone:tel,
            cpfcnpj:cpfcnpj.value,
            atendida:atendida.value,
            converteu:converteu.value,
            obs:obs.value,
            data:new Date().toISOString()
        })
    });

    document.querySelectorAll("input").forEach(i=>i.value="");
    carregar();
}

async function carregar(){
    const res=await fetch(API+"?t="+Date.now());
    registros=await res.json();
    render();
}

function render(){

    const gerente=localStorage.getItem("gerente")==="1";
    const filtro=filtroVendedor.value;

    let hojeLista=registros.filter(r=>dataBR(r.data)===hoje());
    if(filtro!=="TODOS"){
        hojeLista=hojeLista.filter(r=>r.vendedor===filtro);
    }

    const resumoObj={};

    hojeLista.forEach(r=>{
        if(!resumoObj[r.vendedor]) resumoObj[r.vendedor]={t:0,v:0};
        resumoObj[r.vendedor].t++;
        if(r.converteu==="SIM") resumoObj[r.vendedor].v++;
    });

    resumo.innerHTML=Object.entries(resumoObj).map(([v,d])=>{
        const taxa=d.t?((d.v/d.t)*100).toFixed(1):0;
        return `<div class="item"><b>${v}</b><br>Ligações: ${d.t}<br>Vendas: ${d.v}<br>Conversão: ${taxa}%</div>`;
    }).join("") || "Sem ligações hoje";

    lista.innerHTML=hojeLista.reverse().map(r=>`
        <div class="item">
        <b>${r.vendedor}</b><br>
        📅 ${dataBR(r.data)}<br>
        Cliente: ${r.cliente}<br>
        Tel: ${r.telefone}<br>
        Venda: ${r.converteu}<br>
        <button onclick="editar(${r.row})">Editar</button>
        ${gerente?`<button onclick="excluir(${r.row})">Excluir</button>`:""}
        ${r.editado==="SIM"?"<div style='color:yellow'>EDITADO</div>":""}
        </div>
    `).join("") || "Nenhuma ligação hoje";
}

async function editar(row){
    const atual=registros.find(r=>r.row==row);
    await fetch(API,{
        method:"POST",
        body:JSON.stringify({
            action:"editarCompleto",
            row,
            vendedor:prompt("Vendedor:", atual.vendedor),
            cliente:prompt("Cliente:", atual.cliente),
            telefone:prompt("Telefone:", atual.telefone),
            cpfcnpj:prompt("CPF:", atual.cpfcnpj),
            atendida:prompt("Atendida:", atual.atendida),
            converteu:prompt("Venda:", atual.converteu),
            obs:prompt("Obs:", atual.obs)
        })
    });
    carregar();
}

async function excluir(row){
    if(!confirm("Excluir?")) return;
    await fetch(API,{
        method:"POST",
        body:JSON.stringify({action:"excluir",row})
    });
    carregar();
}

setInterval(carregar,3000);
verificar();
carregar();
</script>

</body>
</html>
