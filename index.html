<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAZZO | Call Center V2.4 Premium</title>

<link href="https://fonts.cdnfonts.com/css/bring-race" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    min-height:100vh;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:20px;
}

.container{max-width:520px;margin:auto}

.logo{
    text-align:center;
    font-size:42px;
    margin-bottom:20px;
    font-family:'Bring Race',sans-serif;
}

.white{color:#fff}
.red{
    color:#ff0000;
    text-shadow:0 0 8px #ff0000;
}

.card{
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,0,0,.25);
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
}

input,select,button,textarea{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border:none;
    border-radius:12px;
    font-size:16px;
}

input,select,textarea{
    background:#111;
    color:#fff;
}

button{
    background:linear-gradient(90deg,#700000,#ff0000);
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.item{
    padding:12px;
    border-radius:12px;
    background:#111;
    margin-bottom:10px;
}

.editado{
    color:#ff4444;
    font-size:12px;
    font-weight:bold;
}

#painelGerente{display:none}
</style>
</head>
<body>

<div class="container">

<div class="logo">
<span class="white">TA</span><span class="red">ZZ</span><span class="white">O</span>
</div>

<div class="card">
<h3>Registrar Ligação</h3>

<select id="vendedor">
<option>Joabe</option>
<option>João Gabriel</option>
<option>Fábio</option>
<option>Caio Henrique</option>
</select>

<input type="text" id="cliente" placeholder="Nome do cliente">
<input type="text" id="telefone" placeholder="Telefone">
<input type="text" id="cpfcnpj" placeholder="CPF ou CNPJ">

<select id="atendida">
<option value="SIM">Ligação atendida: SIM</option>
<option value="NAO">Ligação atendida: NÃO</option>
</select>

<select id="converteu">
<option value="SIM">Converteu em venda: SIM</option>
<option value="NAO">Converteu em venda: NÃO</option>
</select>

<textarea id="obs" placeholder="Observações"></textarea>

<button onclick="registrarLigacao()">Registrar ligação</button>
</div>

<button onclick="abrirPainelGerente()">Painel do Gerente</button>

<div id="painelGerente" class="card">
<h3>Painel Gerencial</h3>
<div id="resumo"></div>
</div>

<div class="card">
<h3>Últimas Ligações</h3>
<div id="lista"></div>
</div>

</div>

<script>
const API_URL="SEU_LINK_APPS_SCRIPT";
const SENHA_GERENTE="gerentazzo";

let registros=[];

function abrirPainelGerente(){
    const senha=prompt("Digite a senha:");
    if(senha===SENHA_GERENTE){
        document.getElementById("painelGerente").style.display="block";
    }
}

async function registrarLigacao(){
    const payload={
        action:"registrar",
        vendedor:document.getElementById("vendedor").value,
        cliente:document.getElementById("cliente").value,
        telefone:document.getElementById("telefone").value,
        cpfcnpj:document.getElementById("cpfcnpj").value,
        atendida:document.getElementById("atendida").value,
        converteu:document.getElementById("converteu").value,
        obs:document.getElementById("obs").value,
        editado:"NAO",
        data:new Date().toLocaleString("pt-BR")
    };

    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify(payload)
    });

    alert("Ligação cadastrada");

    limparCampos();
    carregarRegistros();
}

function limparCampos(){
    document.getElementById("cliente").value="";
    document.getElementById("telefone").value="";
    document.getElementById("cpfcnpj").value="";
    document.getElementById("obs").value="";
}

async function carregarRegistros(){
    const response=await fetch(API_URL+"?t="+Date.now());
    registros=await response.json();

    renderLista();
    atualizarResumo();
}

function renderLista(){
    document.getElementById("lista").innerHTML=
        registros.slice(-10).reverse().map((item,index)=>`
            <div class="item">
                <b>${item.vendedor}</b><br>
                ${item.cliente}<br>
                ${item.telefone}<br>
                Atendida: ${item.atendida}<br>
                Venda: ${item.converteu}<br>
                ${item.editado==="SIM" ? '<div class="editado">EDITADA</div>' : ''}
                <button onclick="editarLigacao(${item.row})">
                    Editar venda
                </button>
            </div>
        `).join("");
}

async function editarLigacao(row){
    const novoStatus=prompt("Converteu em venda? SIM ou NAO");

    if(!novoStatus) return;

    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify({
            action:"editar",
            row:row,
            converteu:novoStatus.toUpperCase(),
            editado:"SIM"
        })
    });

    alert("Ligação editada com sucesso");
    carregarRegistros();
}

function atualizarResumo(){
    const total=registros.length;
    const vendas=registros.filter(r=>r.converteu==="SIM").length;

    document.getElementById("resumo").innerHTML=`
        <div>Total: ${total}</div>
        <div>Vendas: ${vendas}</div>
    `;
}

setInterval(carregarRegistros,2000);
carregarRegistros();
</script>

</body>
</html>
