<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAZZO | Call Center V2.5 Premium</title>

<link href="https://fonts.cdnfonts.com/css/bring-race" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    min-height:100vh;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:20px;
}

.container{max-width:520px;margin:auto}

.logo{
    text-align:center;
    font-size:42px;
    margin-bottom:20px;
    font-family:'Bring Race',sans-serif;
}

.white{color:#fff}
.red{
    color:#ff0000;
    text-shadow:0 0 8px #ff0000;
}

.card{
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,0,0,.25);
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
}

input,select,button,textarea{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border:none;
    border-radius:12px;
    font-size:16px;
}

input,select,textarea{
    background:#111;
    color:#fff;
}

button{
    background:linear-gradient(90deg,#700000,#ff0000);
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.item{
    padding:12px;
    border-radius:12px;
    background:#111;
    margin-bottom:10px;
}

.rank-item{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
}

.editado{
    color:#ff4444;
    font-size:12px;
    font-weight:bold;
}

#painelGerente{display:none}
</style>
</head>
<body>

<div class="container">

<div class="logo">
<span class="white">TA</span><span class="red">ZZ</span><span class="white">O</span>
</div>

<div class="card">
<h3>Registrar Ligação</h3>

<select id="vendedor">
<option>Joabe</option>
<option>João Gabriel</option>
<option>Fábio</option>
<option>Caio Henrique</option>
</select>

<input type="text" id="cliente" placeholder="Nome do cliente">
<input type="text" id="telefone" placeholder="Telefone">
<input type="text" id="cpfcnpj" placeholder="CPF ou CNPJ">

<select id="atendida">
<option value="SIM">Ligação atendida: SIM</option>
<option value="NAO">Ligação atendida: NÃO</option>
</select>

<select id="converteu">
<option value="SIM">Converteu em venda: SIM</option>
<option value="NAO">Converteu em venda: NÃO</option>
</select>

<textarea id="obs" placeholder="Observações"></textarea>

<button onclick="registrarLigacao()">Registrar ligação</button>
</div>

<button onclick="abrirPainelGerente()">Painel do Gerente</button>

<div id="painelGerente" class="card">
<h3>Painel Gerencial</h3>

<div id="resumo"></div>

<h3>Ranking por Conversão</h3>
<div id="ranking"></div>

<button onclick="gerarPDF()">Relatório Diário Premium</button>
<button onclick="logoutGerente()">Sair</button>
</div>

<div class="card">
<h3>Últimas Ligações</h3>
<div id="lista"></div>
</div>

</div>

<script>
const API_URL="SEU_LINK_APPS_SCRIPT";
const SENHA_GERENTE="gerentazzo";

let registros=[];

function abrirPainelGerente(){
    const senha=prompt("Digite a senha:");
    if(senha===SENHA_GERENTE){
        localStorage.setItem("gerente","true");
        document.getElementById("painelGerente").style.display="block";
        atualizarResumo();
    }else{
        alert("Senha incorreta");
    }
}

function logoutGerente(){
    localStorage.removeItem("gerente");
    document.getElementById("painelGerente").style.display="none";
}

function verificarSessao(){
    if(localStorage.getItem("gerente")==="true"){
        document.getElementById("painelGerente").style.display="block";
    }
}

async function registrarLigacao(){
    const payload={
        action:"registrar",
        vendedor:document.getElementById("vendedor").value,
        cliente:document.getElementById("cliente").value,
        telefone:document.getElementById("telefone").value,
        cpfcnpj:document.getElementById("cpfcnpj").value,
        atendida:document.getElementById("atendida").value,
        converteu:document.getElementById("converteu").value,
        obs:document.getElementById("obs").value,
        data:new Date().toLocaleString("pt-BR"),
        editado:"NAO"
    };

    try{
        await fetch(API_URL,{
            method:"POST",
            body:JSON.stringify(payload)
        });

        alert("Ligação cadastrada");

        limparCampos();
        carregarRegistros();
    }catch(e){
        alert("Erro ao registrar");
    }
}

function limparCampos(){
    document.getElementById("cliente").value="";
    document.getElementById("telefone").value="";
    document.getElementById("cpfcnpj").value="";
    document.getElementById("obs").value="";
}

async function carregarRegistros(){
    try{
        const response=await fetch(API_URL+"?t="+Date.now());
        registros=await response.json();

        if(!Array.isArray(registros)) registros=[];

        renderLista();
        atualizarResumo();
    }catch(e){
        console.log("Erro ao carregar");
    }
}

function renderLista(){
    document.getElementById("lista").innerHTML=
        registros.slice(-10).reverse().map(item=>`
            <div class="item">
                <b>${item.vendedor}</b><br>
                ${item.cliente}<br>
                ${item.telefone}<br>
                Atendida: ${item.atendida}<br>
                Venda: ${item.converteu}<br>
                ${item.editado==="SIM" ? '<div class="editado">EDITADA</div>' : ''}
                <button onclick="editarLigacao(${item.row})">Editar venda</button>
            </div>
        `).join("");
}

async function editarLigacao(row){
    const novoStatus=prompt("Converteu em venda? SIM ou NAO");

    if(!novoStatus) return;

    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify({
            action:"editar",
            row:row,
            converteu:novoStatus.toUpperCase()
        })
    });

    alert("Ligação editada");
    carregarRegistros();
}

function atualizarResumo(){
    const total=registros.length;
    const atendidas=registros.filter(r=>r.atendida==="SIM").length;
    const vendas=registros.filter(r=>r.converteu==="SIM").length;
    const taxa=total>0?((vendas/total)*100).toFixed(1):0;

    document.getElementById("resumo").innerHTML=`
        <div>Total de ligações: ${total}</div>
        <div>Atendidas: ${atendidas}</div>
        <div>Convertidas: ${vendas}</div>
        <div>Taxa geral: ${taxa}%</div>
    `;

    atualizarRanking();
}

function atualizarRanking(){
    const vendedores=["Joabe","João Gabriel","Fábio","Caio Henrique"];

    const ranking=vendedores.map(nome=>{
        const lig=registros.filter(r=>r.vendedor===nome).length;
        const vendas=registros.filter(
            r=>r.vendedor===nome && r.converteu==="SIM"
        ).length;

        const taxa=lig>0?((vendas/lig)*100).toFixed(1):0;

        return {nome,lig,vendas,taxa};
    }).sort((a,b)=>b.taxa-a.taxa);

    document.getElementById("ranking").innerHTML=
        ranking.map((r,i)=>`
            <div class="rank-item">
                <span>${i+1}º ${r.nome}</span>
                <span>${r.taxa}% (${r.vendas}/${r.lig})</span>
            </div>
        `).join("");
}

function gerarPDF(){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(24);
    doc.text("TAZZO", 85, 15);

    doc.setFontSize(14);
    doc.text("Relatório Diário", 70, 25);

    let y=40;

    doc.rect(10,y,190,10);
    doc.text("Vendedor",15,y+7);
    doc.text("Cliente",60,y+7);
    doc.text("Venda",160,y+7);

    y+=15;

    registros.forEach(item=>{
        doc.rect(10,y,190,10);
        doc.text(item.vendedor,15,y+7);
        doc.text(item.cliente.substring(0,20),60,y+7);
        doc.text(item.converteu,160,y+7);
        y+=10;
    });

    doc.save("relatorio_diario_tazzo.pdf");
}

setInterval(carregarRegistros,2000);

verificarSessao();
carregarRegistros();
</script>

</body>
</html>
