<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAZZO | Call Center V2.4 Premium</title>

<link href="https://fonts.cdnfonts.com/css/bring-race" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    min-height:100vh;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:20px;
}

.container{
    max-width:520px;
    margin:auto;
}

.logo{
    text-align:center;
    font-size:42px;
    margin-bottom:20px;
    font-family:'Bring Race',sans-serif;
}

.white{color:#fff}
.red{
    color:#ff0000;
    text-shadow:0 0 6px #ff0000,0 0 12px #ff0000;
}

.relogio{
    text-align:center;
    margin-bottom:20px;
    color:#ccc;
    font-size:14px;
}

.card{
    background:#111;
    border:1px solid rgba(255,0,0,.25);
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
}

input,select,button,textarea{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border:none;
    border-radius:12px;
    font-size:16px;
}

input,select,textarea{
    background:#222;
    color:#fff;
}

button{
    background:linear-gradient(90deg,#700000,#ff0000);
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.item{
    padding:12px;
    background:#111;
    border:1px solid rgba(255,255,255,.06);
    margin-bottom:10px;
    border-radius:12px;
}

.excluir-btn{
    margin-top:10px;
    background:#550000;
}

#painelGerente{
    display:none;
}
</style>
</head>
<body>

<div class="container">

<div class="logo">
<span class="white">TA</span><span class="red">ZZ</span><span class="white">O</span>
</div>

<div class="relogio" id="relogio"></div>

<div class="card">
<h3>Registrar Ligação</h3>

<select id="vendedor">
<option>Joabe</option>
<option>João Gabriel</option>
<option>Fábio</option>
<option>Caio Henrique</option>
</select>

<input type="text" id="cliente" placeholder="Nome do cliente">
<input type="text" id="telefone" placeholder="Telefone">
<input type="text" id="cpfcnpj" placeholder="CPF ou CNPJ">

<select id="atendida">
<option value="SIM">Ligação atendida: SIM</option>
<option value="NAO">Ligação atendida: NÃO</option>
</select>

<select id="converteu">
<option value="SIM">Converteu em venda: SIM</option>
<option value="NAO">Converteu em venda: NÃO</option>
</select>

<textarea id="obs" placeholder="Observações"></textarea>

<button onclick="registrarLigacao()">
Registrar ligação
</button>
</div>

<button onclick="abrirPainelGerente()">
Painel do Gerente
</button>

<div id="painelGerente" class="card">
<h3>Painel Gerencial</h3>

<select id="filtroVendedor" onchange="renderListaGerente()">
<option value="">Todos vendedores</option>
<option>Joabe</option>
<option>João Gabriel</option>
<option>Fábio</option>
<option>Caio Henrique</option>
</select>

<input type="text"
id="filtroData"
placeholder="Filtrar por data (dd/mm/aaaa)"
onkeyup="renderListaGerente()">

<button onclick="removerDuplicadasReais()">
Excluir duplicadas
</button>

<div id="listaGerente"></div>

<button onclick="logoutGerente()">Sair</button>
</div>

<div class="card">
<h3>Últimas Ligações</h3>
<div id="lista"></div>
</div>

</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbxpj0nN8Hv6F7fAr8CgC9Vp9IQgEYkT6otLUCwJMK-JRty1u0H1EjjBlKBJ3tpw4hxs/exec";
const SENHA_GERENTE="gerentazzo";

let registros=[];

function atualizarRelogio(){
    const agora=new Date(
        new Date().toLocaleString("en-US",{
            timeZone:"America/Sao_Paulo"
        })
    );

    document.getElementById("relogio").innerText=
        agora.toLocaleString("pt-BR")+" • Brasília";
}

setInterval(atualizarRelogio,1000);
atualizarRelogio();

function abrirPainelGerente(){
    const senha=prompt("Digite a senha:");

    if(senha===SENHA_GERENTE){
        localStorage.setItem("gerente","true");
        document.getElementById("painelGerente").style.display="block";
        carregarRegistros();
    }else{
        alert("Senha incorreta");
    }
}

function verificarSessao(){
    if(localStorage.getItem("gerente")==="true"){
        document.getElementById("painelGerente").style.display="block";
    }
}

function logoutGerente(){
    localStorage.removeItem("gerente");
    document.getElementById("painelGerente").style.display="none";
}

async function registrarLigacao(){
    const payload={
        vendedor:document.getElementById("vendedor").value,
        cliente:document.getElementById("cliente").value,
        telefone:document.getElementById("telefone").value,
        cpfcnpj:document.getElementById("cpfcnpj").value,
        atendida:document.getElementById("atendida").value,
        converteu:document.getElementById("converteu").value,
        obs:document.getElementById("obs").value,
        data:new Date().toLocaleString("pt-BR",{
            timeZone:"America/Sao_Paulo"
        })
    };

    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify(payload)
    });

    alert("Ligação cadastrada com sucesso");

    limparCampos();
    carregarRegistros();
}

function limparCampos(){
    document.getElementById("cliente").value="";
    document.getElementById("telefone").value="";
    document.getElementById("cpfcnpj").value="";
    document.getElementById("obs").value="";
}

async function carregarRegistros(){
    const response=await fetch(API_URL);
    registros=await response.json();

    registros=registros.filter(item=>
        item &&
        item.vendedor &&
        item.cliente
    );

    renderListaPublica();
    renderListaGerente();
}

function renderListaPublica(){
    document.getElementById("lista").innerHTML=
        registros.slice(-10).reverse().map(item=>`
            <div class="item">
                <b>${item.vendedor}</b><br>
                ${item.cliente}<br>
                ${item.telefone}<br>
                ${item.data}<br>
                Atendida: ${item.atendida}<br>
                Venda: ${item.converteu}
            </div>
        `).join("");
}

function renderListaGerente(){
    const vendedorFiltro=
        document.getElementById("filtroVendedor").value;

    const dataFiltro=
        document.getElementById("filtroData").value;

    let lista=registros.filter(item=>{
        const vendedorOk=
            !vendedorFiltro ||
            item.vendedor===vendedorFiltro;

        const dataOk=
            !dataFiltro ||
            item.data.includes(dataFiltro);

        return vendedorOk && dataOk;
    });

    document.getElementById("listaGerente").innerHTML=
        lista.reverse().map(item=>`
            <div class="item">
                <b>${item.vendedor}</b><br>
                ${item.cliente}<br>
                ${item.telefone}<br>
                ${item.data}<br>
                Atendida: ${item.atendida}<br>
                Venda: ${item.converteu}

                <button class="excluir-btn"
                onclick="excluirRegistroReal(${item.row})">
                    Excluir
                </button>
            </div>
        `).join("");
}

async function excluirRegistroReal(row){
    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify({
            action:"delete",
            row:row
        })
    });

    carregarRegistros();
}

async function removerDuplicadasReais(){
    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify({
            action:"deleteDuplicates"
        })
    });

    alert("Duplicadas removidas");
    carregarRegistros();
}

setInterval(carregarRegistros,2000);

verificarSessao();
carregarRegistros();
</script>

</body>
</html>
