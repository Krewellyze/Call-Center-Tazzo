<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAZZO | Call Center V2.2 Premium</title>

<link href="https://fonts.cdnfonts.com/css/bring-race" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    min-height:100vh;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:20px;
}

#splash{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    flex-direction:column;
    transition:1s;
}

#splash .logo{
    font-size:58px;
    font-family:'Bring Race',sans-serif;
}

.container{max-width:520px;margin:auto}

.logo{
    text-align:center;
    font-size:42px;
    margin-bottom:20px;
    font-family:'Bring Race',sans-serif;
}

.white{color:#fff}
.red{
    color:#ff0000;
    text-shadow:
        0 0 6px #ff0000,
        0 0 12px #ff0000,
        0 0 25px #ff0000;
}

.card{
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,0,0,.25);
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 0 15px rgba(255,0,0,.15);
}

input,select,button,textarea{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border:none;
    border-radius:12px;
    font-size:16px;
}

input,select,textarea{
    background:#111;
    color:#fff;
}

button{
    background:linear-gradient(90deg,#700000,#ff0000);
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.item{
    padding:12px;
    border-radius:12px;
    background:#111;
    margin-bottom:10px;
    position:relative;
}

.rank-item{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.excluir-btn{
    margin-top:8px;
    padding:8px;
    font-size:14px;
    background:#500000;
}

#painelGerente{display:none}

#mensagemSucesso{
    display:none;
    text-align:center;
    padding:12px;
    margin-bottom:15px;
    border-radius:10px;
    background:rgba(0,255,100,.15);
    border:1px solid rgba(0,255,100,.35);
    color:#00ff88;
    font-weight:bold;
}
</style>
</head>
<body>

<div id="splash">
    <div class="logo">
        <span class="white">TA</span><span class="red">ZZ</span><span class="white">O</span>
    </div>
</div>

<div class="container">

<div class="logo">
    <span class="white">TA</span><span class="red">ZZ</span><span class="white">O</span>
</div>

<div id="mensagemSucesso">Ligação cadastrada com sucesso</div>

<div class="card">
<h3>Registrar Ligação</h3>

<select id="vendedor">
<option>Joabe</option>
<option>João Gabriel</option>
<option>Fábio</option>
<option>Caio Henrique</option>
</select>

<input type="text" id="cliente" placeholder="Nome do cliente">
<input type="text" id="telefone" placeholder="Telefone">
<input type="text" id="cpfcnpj" placeholder="CPF ou CNPJ">

<select id="atendida">
<option value="SIM">Ligação atendida: SIM</option>
<option value="NAO">Ligação atendida: NÃO</option>
</select>

<select id="converteu">
<option value="SIM">Converteu em venda: SIM</option>
<option value="NAO">Converteu em venda: NÃO</option>
</select>

<textarea id="obs" placeholder="Observações"></textarea>

<button onclick="registrarLigacao()">Registrar ligação</button>
</div>

<button onclick="abrirPainelGerente()">Painel do Gerente</button>

<div id="painelGerente" class="card">
<h3>Painel Gerencial</h3>

<div id="resumo"></div>

<h3>Ranking por Conversão</h3>
<div id="ranking"></div>

<button onclick="removerDuplicadas()">
Excluir ligações duplicadas
</button>

<button onclick="gerarPDF()">Gerar Relatório Premium</button>
<button onclick="logoutGerente()">Sair</button>
</div>

<div class="card">
<h3>Últimas Ligações</h3>
<div id="lista"></div>
</div>

</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbxpj0nN8Hv6F7fAr8CgC9Vp9IQgEYkT6otLUCwJMK-JRty1u0H1EjjBlKBJ3tpw4hxs/exec";
const SENHA_GERENTE="gerentazzo";

let registros=[];

setTimeout(()=>{
    document.getElementById("splash").style.opacity="0";
    setTimeout(()=>{
        document.getElementById("splash").style.display="none";
    },1000);
},2500);

function mostrarMensagemSucesso(){
    const msg=document.getElementById("mensagemSucesso");
    msg.style.display="block";

    setTimeout(()=>{
        msg.style.display="none";
    },2000);
}

function abrirPainelGerente(){
    const senha=prompt("Digite a senha do gerente:");
    if(senha===SENHA_GERENTE){
        localStorage.setItem("gerente","true");
        document.getElementById("painelGerente").style.display="block";
        atualizarResumo();
    }else{
        alert("Senha incorreta");
    }
}

function verificarSessao(){
    if(localStorage.getItem("gerente")==="true"){
        document.getElementById("painelGerente").style.display="block";
    }
}

function logoutGerente(){
    localStorage.removeItem("gerente");
    document.getElementById("painelGerente").style.display="none";
}

async function registrarLigacao(){
    const payload={
        vendedor:document.getElementById("vendedor").value,
        cliente:document.getElementById("cliente").value,
        telefone:document.getElementById("telefone").value,
        cpfcnpj:document.getElementById("cpfcnpj").value,
        atendida:document.getElementById("atendida").value,
        converteu:document.getElementById("converteu").value,
        obs:document.getElementById("obs").value,
        data:new Date().toLocaleString("pt-BR")
    };

    await fetch(API_URL,{
        method:"POST",
        body:JSON.stringify(payload)
    });

    limparCampos();
    mostrarMensagemSucesso();
    carregarRegistros();
}

function limparCampos(){
    document.getElementById("cliente").value="";
    document.getElementById("telefone").value="";
    document.getElementById("cpfcnpj").value="";
    document.getElementById("obs").value="";
}

async function carregarRegistros(){
    const response=await fetch(API_URL);
    registros=await response.json();

    renderLista();
    atualizarResumo();
}

function excluirRegistro(index){
    registros.splice(index,1);
    renderLista();
    atualizarResumo();
}

function removerDuplicadas(){
    const mapa=new Set();

    registros=registros.filter(item=>{
        const chave=
            item.vendedor+
            item.cliente+
            item.telefone+
            item.data;

        if(mapa.has(chave)){
            return false;
        }

        mapa.add(chave);
        return true;
    });

    renderLista();
    atualizarResumo();

    alert("Duplicadas removidas da visualização.");
}

function renderLista(){
    document.getElementById("lista").innerHTML=
        registros.slice(-10).reverse().map((item,index)=>`
            <div class="item">
                <b>${item.vendedor}</b><br>
                ${item.cliente}<br>
                ${item.telefone}<br>
                Atendida: ${item.atendida}<br>
                Venda: ${item.converteu}
                <button class="excluir-btn"
                onclick="excluirRegistro(${registros.length-1-index})">
                Excluir
                </button>
            </div>
        `).join("");
}

function atualizarResumo(){
    const total=registros.length;
    const atendidas=registros.filter(r=>r.atendida==="SIM").length;
    const vendas=registros.filter(r=>r.converteu==="SIM").length;
    const taxa=total>0?((vendas/total)*100).toFixed(1):0;

    document.getElementById("resumo").innerHTML=`
        <div>Total de ligações: ${total}</div>
        <div>Atendidas: ${atendidas}</div>
        <div>Convertidas: ${vendas}</div>
        <div>Taxa geral: ${taxa}%</div>
    `;

    atualizarRanking();
}

function atualizarRanking(){
    const vendedores=["Joabe","João Gabriel","Fábio","Caio Henrique"];

    const ranking=vendedores.map(nome=>{
        const lig=registros.filter(r=>r.vendedor===nome).length;
        const vendas=registros.filter(
            r=>r.vendedor===nome && r.converteu==="SIM"
        ).length;

        const taxa=lig>0?((vendas/lig)*100).toFixed(1):0;

        return {nome,lig,vendas,taxa};
    }).sort((a,b)=>b.taxa-a.taxa);

    document.getElementById("ranking").innerHTML=
        ranking.map((r,i)=>`
            <div class="rank-item">
                <span>${i+1}º ${r.nome}</span>
                <span>${r.taxa}% (${r.vendas}/${r.lig})</span>
            </div>
        `).join("");
}

function gerarPDF(){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(24);
    doc.text("TAZZO", 90, 15);

    doc.setFontSize(14);
    doc.text("Relatório Call Center Premium", 60, 25);

    let y=40;

    registros.slice(-20).forEach(item=>{
        doc.text(
            `${item.vendedor} | ${item.cliente} | ${item.converteu}`,
            10,y
        );
        y+=10;
    });

    doc.save("relatorio_call_center_tazzo_v22.pdf");
}

setInterval(carregarRegistros,2000);

verificarSessao();
carregarRegistros();
</script>

</body>
</html>
